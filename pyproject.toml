[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopostule"
version = "0.1.0"
description = "Candidatures spontanées automatisées pour les métiers de l'informatique (France)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
ia = ["anthropic>=1.11"]
dns = ["dnspython>=2.6"]
dev = ["pytest>=8"]

[project.scripts]
autopostule = "autopostule.cli:main"

[tool.setuptools]
packages = ["autopostule"]

[tool.setuptools.package-data]
autopostule = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
